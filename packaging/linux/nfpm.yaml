# .deb and .rpm, from packaging/linux/build.sh, which fills build/linux/root. Paths are from the repo root.
name: unplugg
arch: ${GOARCH}  # amd64 or arm64; nfpm says x86_64 or aarch64 to rpm
platform: linux
version: ${VERSION}
maintainer: Upa Das <upamanyudas@hotmail.com>
description: Guards a laptop while you step away. A siren, photos, video and location go to Telegram.
homepage: https://github.com/upamanyudas/unplugg
license: MIT
contents:
  - src: build/linux/root/usr
    dst: /usr
    type: tree
overrides:
  deb:
    # every desktop has them; Ubuntu 24.04 renamed both
    depends: [libgtk-3-0 | libgtk-3-0t64, libssl3 | libssl3t64]
    recommends: [pulseaudio-utils]     # pactl: siren at full volume, device names
  rpm:
    depends: [gtk3, openssl-libs]
    recommends: [pulseaudio-utils]
