[package]
name = "unplugg"
version = "1.2.0"
edition = "2021"

[dependencies]
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-core-location = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
