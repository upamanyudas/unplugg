[package]
name = "unplugg"
version = "1.2.0"
edition = "2021"

[dependencies]
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
