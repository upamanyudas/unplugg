name: Release unplugg

# Admin-initiated: run from the Actions tab, pick a bump or type a version.
# Builds every download (build.yml). Only once all pass does it commit the
# version to Cargo.toml, the cask and the Scoop manifest, tag it and publish.
#
# No Apple Developer ID ($99/yr), so the app isn't notarized: people open it once
# via System Settings › Privacy & Security › Open Anyway.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump the version in Cargo.toml"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or an exact version, e.g. 2.0.0 (overrides the bump)"
        required: false

permissions:
  contents: write  # push the version commit and tag, create the release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.next.outputs.current }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          VERSION="${EXACT:-$NEXT}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION isn't X.Y.Z"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "v$VERSION"; then
            echo "::error::v$VERSION is already released"
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit  # the mac signing certificate
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      CURRENT: ${{ needs.version.outputs.current }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # 1.x's updater looks for the dmg of its own chip; the universal one serves both
      - name: The dmg under 1.x's names
        run: |
          cd dist
          for arch in arm64 x86_64; do
            cp unplugg.dmg "unplugg-$arch.dmg"
            sha256sum "unplugg-$arch.dmg" > "unplugg-$arch.dmg.sha256"
          done
      - name: Commit the version, the cask and the Scoop manifest
        run: |
          hash() { cut -d ' ' -f 1 "dist/unplugg-$1.sha256"; }
          MAC=$(cut -d ' ' -f 1 dist/unplugg.dmg.sha256)
          sed -i -E "1,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"unplugg\"$/{n;s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.lock
          sed -i "s/\"$CURRENT\"/\"$VERSION\"/" Casks/unplugg.rb
          sed -i -E "s/(arm: +)\"[0-9a-f]{64}\"/\1\"$MAC\"/
                     s/(intel: +)\"[0-9a-f]{64}\"/\1\"$MAC\"/
                     s/(arm64_linux: +)\"[0-9a-f]{64}\"/\1\"$(hash linux-arm64.AppImage)\"/
                     s/(x86_64_linux: +)\"[0-9a-f]{64}\"/\1\"$(hash linux-x86_64.AppImage)\"/" Casks/unplugg.rb
          jq --arg v "$VERSION" --arg x64 "$(hash windows-x64.zip)" --arg arm64 "$(hash windows-arm64.zip)" '
            .version = $v
            | .architecture |= map_values(.url |= sub("/v[0-9.]+/"; "/v\($v)/"))
            | .architecture."64bit".hash = $x64
            | .architecture.arm64.hash = $arm64' bucket/unplugg.json > manifest.json
          mv manifest.json bucket/unplugg.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD "v$VERSION"  # both or neither
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/unplugg*
          generate_release_notes: true
