[package]
name = "unplugg"
version = "1.2.0"
edition = "2021"

[dependencies]
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-core-location = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
claxon = "0.4"
windows = { version = "0.62", features = ["Devices_Sensors", "Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Security_Credentials_UI", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Power", "Win32_System_WinRT", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
