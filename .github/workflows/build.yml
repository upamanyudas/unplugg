name: Build unplugg

# On every push and pull request: build every download, so a packaging break
# shows up before a release. Each run keeps them as artifacts. Release unplugg
# calls this too, with the version to stamp.
#
# Fixed names: the updater, the cask and Scoop find them by name.
# Windows isn't signed: SmartScreen asks once (More info › Run anyway), like Open Anyway.
on:
  push:
    branches: ["**"]  # not tags: a release builds its own
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string

jobs:
  # one universal app for Apple Silicon and Intel. If the UNPLUGG_CERT_P12 secret
  # holds the "unplugg cert" certificate, build.sh signs with it, so camera, mic
  # and location grants survive updates.
  mac:
    runs-on: macos-26
    env:  # a step's `if:` can't read secrets, but it can read env
      CERT_P12: ${{ secrets.UNPLUGG_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.UNPLUGG_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the signing certificate
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Stamp version
        if: inputs.version != ''
        run: sed -i '' -E '1,/^version = /s/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml
      - name: Build
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          packaging/mac/build.sh
          cd dist
          shasum -a 256 unplugg.dmg > unplugg.dmg.sha256  # the updater and the cask check it
      - uses: actions/upload-artifact@v7
        with:
          name: unplugg-mac
          path: dist/unplugg.dmg*

  # x64 and arm64 from one x64 runner: its Visual Studio has the ARM64 tools
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        if: inputs.version != ''
        run: sed -i -E '1,/^version = /s/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml
      - name: Build, installer and zip
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ -x "C:/Program Files (x86)/NSIS/makensis.exe" ] || choco install nsis -y --no-progress
          mkdir -p dist
          for ARCH in x64 arm64; do
            TARGET=$([ $ARCH = x64 ] && echo x86_64 || echo aarch64)-pc-windows-msvc
            rustup target add $TARGET
            cargo build --release --target $TARGET
            "C:/Program Files (x86)/NSIS/makensis.exe" -V2 -DAppVersion=$VERSION -DArch=$ARCH packaging/windows/unplugg.nsi
            # one unplugg folder inside, Scoop's extract_dir
            mkdir -p zip-$ARCH/unplugg
            cp target/$TARGET/release/unplugg.exe zip-$ARCH/unplugg/
            pwsh -Command "Compress-Archive -Path zip-$ARCH/unplugg -DestinationPath dist/unplugg-windows-$ARCH.zip"
          done
          cd dist
          for f in unplugg-windows-*; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: unplugg-windows
          path: dist/unplugg-windows-*

  # Ubuntu 22.04 on both: glibc 2.35 is the floor (Debian 12, Fedora 36 and later)
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            nfpm: x86_64
          - runner: ubuntu-22.04-arm
            nfpm: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        if: inputs.version != ''
        run: sed -i -E '1,/^version = /s/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config nasm libgtk-3-dev libssl-dev libclang-dev meson ninja-build squashfs-tools file
          command -v cargo || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_${{ matrix.nfpm }}.tar.gz | sudo tar xz -C /usr/local/bin nfpm
      - name: Build
        run: |
          packaging/linux/build.sh
          cd dist
          for f in unplugg-linux-*; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: unplugg-linux-${{ matrix.nfpm }}
          path: dist/unplugg-linux-*
