name: Release unplugg

# Admin-initiated: run from the Actions tab, pick a bump or type a version.
# Builds the .app on Apple Silicon and Intel runners. Only once both pass does it
# commit the version to unplugg/__init__.py and the cask, tag it and publish a
# .dmg of each.
#
# ponytail: per-arch builds instead of a single "universal2" binary. hidapi (the
# lid-angle sensor's dependency) ships no universal2 wheel, so a universal2
# py2app build would mean compiling it for both archs by hand. Two native builds
# work. Revisit if hidapi gains a universal2 wheel.
#
# No Apple Developer ID ($99/yr), so the app isn't notarized: people open it once
# via System Settings › Privacy & Security › Open Anyway. If the UNPLUGG_CERT_P12
# secret holds the "unplugg cert" certificate, setup.py signs with it, so every
# release keeps one identity and camera, mic and location grants survive updates.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump the version in unplugg/__init__.py"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or an exact version, e.g. 1.0.0 (overrides the bump)"
        required: false

permissions:
  contents: write  # push the version commit and tag, create the release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.next.outputs.current }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          CURRENT=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' unplugg/__init__.py)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          VERSION="${EXACT:-$NEXT}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION isn't X.Y.Z"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "v$VERSION"; then
            echo "::error::v$VERSION is already released"
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-26        # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-26-intel  # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:  # a step's `if:` can't read secrets, but it can read env
      CERT_P12: ${{ secrets.UNPLUGG_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.UNPLUGG_CERT_PASSWORD }}
      CURRENT: ${{ needs.version.outputs.current }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import the signing certificate
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Stamp version
        run: sed -i '' "s/\"$CURRENT\"/\"$VERSION\"/" unplugg/__init__.py
      - name: Build .app
        run: python setup.py py2app
      # a fixed name per arch: the in-app updater picks this Mac's dmg by it
      - name: Disk image
        run: |
          mkdir dmg
          ditto dist/unplugg.app dmg/unplugg.app
          ln -s /Applications dmg/Applications  # drag the app onto it to install
          DMG="unplugg-${{ matrix.arch }}.dmg"
          for try in 1 2 3; do  # hdiutil on hosted runners sometimes says "Resource busy"
            hdiutil create -volname unplugg -srcfolder dmg -format UDZO "dist/$DMG" && break
            sleep 5
          done
          cd dist
          shasum -a 256 "$DMG" > "$DMG.sha256"  # the updater and the cask check it
      - uses: actions/upload-artifact@v7
        with:
          name: unplugg-${{ matrix.arch }}
          path: dist/unplugg-${{ matrix.arch }}.dmg*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      CURRENT: ${{ needs.version.outputs.current }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Commit the version and the cask
        run: |
          ARM=$(cut -d ' ' -f 1 dist/unplugg-arm64.dmg.sha256)
          INTEL=$(cut -d ' ' -f 1 dist/unplugg-x86_64.dmg.sha256)
          sed -i "s/\"$CURRENT\"/\"$VERSION\"/" unplugg/__init__.py Casks/unplugg.rb
          sed -i -E "s/(arm: +)\"[0-9a-f]{64}\"/\1\"$ARM\"/; s/(intel: +)\"[0-9a-f]{64}\"/\1\"$INTEL\"/" Casks/unplugg.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD "v$VERSION"  # both or neither
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/unplugg-*
          generate_release_notes: true
