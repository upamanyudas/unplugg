name: Build Windows and Linux

# On every push and pull request: build the Windows and Linux packages, so a
# packaging break shows up before a release. Each run keeps them as artifacts.
# Release unplugg calls this too, with the version to stamp.
#
# Fixed names, like the dmgs: the updater, the cask and Scoop find them by name.
# Not signed: SmartScreen asks once (More info › Run anyway), like Open Anyway.
on:
  push:
    branches: ["**"]  # not tags: a release builds its own
  pull_request:
  workflow_call:
    inputs:
      current:
        type: string
      version:
        type: string

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Stamp version
        if: inputs.version != ''
        run: sed -i 's/"${{ inputs.current }}"/"${{ inputs.version }}"/' unplugg/__init__.py
      - name: Build
        run: python packaging/build.py
      - name: Installer and zip
        run: |
          VERSION=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' unplugg/__init__.py)
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$VERSION" packaging/windows/unplugg.iss
          cd dist
          7z a unplugg-windows-x64.zip unplugg  # one unplugg folder inside, Scoop's extract_dir
          for f in unplugg-windows-x64-setup.exe unplugg-windows-x64.zip; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: unplugg-windows
          path: dist/unplugg-windows-x64*

  # 22.04's glibc, so the build runs on Ubuntu 22.04+, Debian 12+ and Fedora 36+
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Stamp version
        if: inputs.version != ''
        run: sed -i 's/"${{ inputs.current }}"/"${{ inputs.version }}"/' unplugg/__init__.py
      - name: Build
        run: python packaging/build.py
      - name: AppImage
        run: |
          mkdir AppDir
          cp -r dist/unplugg AppDir/
          cp packaging/linux/unplugg.desktop AppDir/
          cp assets/logo.png AppDir/unplugg.png
          install -m 755 packaging/linux/AppRun AppDir/AppRun
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/unplugg-linux-x86_64.AppImage
      - name: .deb and .rpm
        run: |
          export VERSION=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' unplugg/__init__.py)
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | tar xz nfpm
          ./nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/unplugg-linux-amd64.deb
          ./nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/unplugg-linux-x86_64.rpm
          cd dist
          for f in unplugg-linux-*; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: unplugg-linux
          path: dist/unplugg-linux-*
